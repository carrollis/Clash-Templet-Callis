global-ua: clash

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui

find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - 'substore-rear.planet-teddy.org'
    - 'sub-store-keisuke.up.railway.app'
    - '*.planet-teddy.org'
    - 'doh.pub'
    - 'dns.alidns.com'
    - 'dns.google'
    - '*.lan'
    - '*.local'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.push.apple.com'

  nameserver:
    - 'https://119.29.29.29/dns-query'
    - 'https://223.5.5.5/dns-query'
    - '223.5.5.5'

  nameserver-policy:
    "*.bestvmr.com": "47.110.75.65:8053"
    "bestvmr.com": "47.110.75.65:8053"
    "geosite:cn": "119.29.29.29"
    "+.google.com": "https://dns.cloudflare.com/dns-query"
    "+.googleapis.com": "https://dns.cloudflare.com/dns-query"
    "+.youtube.com": "https://dns.cloudflare.com/dns-query"
    "+.facebook.com": "https://dns.cloudflare.com/dns-query"
    "+.twitter.com": "https://dns.cloudflare.com/dns-query"
    "+.github.com": "https://dns.cloudflare.com/dns-query"
    "+.sdykjym.cc":
        - "https://api-query.yunkai002.top/89dffa593f26dc3633027c7fc35fb0e3fe8a0c7875e5effb"
        - "https://64.83.40.123:40443//89dffa593f26dc3633027c7fc35fb0e3fe8a0c7875e5effb"
        - "https://dns.controld.com/zlyskwxxt6"

  fallback-filter:
    geoip: true
    geoip-code: "CN"
    ipcidr:
      - 240.0.0.0/4

proxies:
  - name: "🟢 直连"
    type: direct
    udp: true

proxy-providers:
  MySubGroup:
    benchmark-timeout: 300
    benchmark-url: https://www.epochtimes.com/
    interval: 86400
    url: "{{SUB_URL}}"

